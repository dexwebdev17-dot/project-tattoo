<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor Template — Marchetti Camera Oscura</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0d0a09;
      color: #d6cfc6;
    }
    .font-oswald {
      font-family: 'Oswald', sans-serif;
    }
    /* Custom Scrollbar per l'editor */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #14100e;
    }
    ::-webkit-scrollbar-thumb {
      background: #2b221f;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #c94a3a;
    }
    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s cubic-bezier(0, 1, 0, 1);
    }
    .accordion-content.open {
      max-height: 2500px;
      transition: max-height 0.5s ease-in-out;
    }
    /* Preview Frame container */
    .device-desktop {
      width: 100%;
      height: 100%;
      transition: all 0.3s ease;
    }
    .device-mobile {
      width: 395px;
      height: 780px;
      border: 12px solid #241c19;
      border-radius: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      transition: all 0.3s ease;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

  <header class="h-16 bg-[#070504] border-b border-[#241c19] px-4 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-[#c94a3a] shadow-[0_0_8px_#c94a3a] animate-pulse"></div>
      <h1 class="font-oswald text-lg tracking-wider text-white uppercase">Camera Oscura — <span class="text-[#c94a3a]">Live Editor</span></h1>
    </div>

    <!-- Toolbar della Dashboard -->
    <div class="flex items-center gap-2">
      <!-- Toggle Sidebar -->
      <button id="btn-toggle-sidebar" class="px-3 py-1.5 text-xs bg-[#1a1412] hover:bg-[#28201d] text-gray-300 rounded border border-[#382b27] transition flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg>
        <span class="hidden sm:inline">Pannello</span>
      </button>

      <!-- Viewport Controls -->
      <div class="bg-[#14100e] border border-[#241c19] rounded p-0.5 flex items-center">
        <button id="view-desktop" class="p-1.5 text-xs bg-[#241c19] text-white rounded transition" title="Vista Desktop">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        </button>
        <button id="view-mobile" class="p-1.5 text-xs text-gray-400 hover:text-white rounded transition" title="Vista Mobile">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
        </button>
      </div>

      <div class="h-5 w-px bg-[#241c19] mx-1"></div>

      <!-- Action Buttons -->
      <button id="btn-reset" class="px-3 py-1.5 text-xs bg-red-950/40 hover:bg-red-900/60 text-red-300 rounded border border-red-900/50 transition">
        Reset
      </button>
      
      <button id="btn-export-json" class="px-3 py-1.5 text-xs bg-[#1a1412] hover:bg-[#28201d] text-gray-300 rounded border border-[#382b27] transition hidden md:block">
        Salva JSON
      </button>
      <input type="file" id="input-import-json" accept=".json" class="hidden">
      <button id="btn-import-json" class="px-3 py-1.5 text-xs bg-[#1a1412] hover:bg-[#28201d] text-gray-300 rounded border border-[#382b27] transition hidden md:block">
        Carica JSON
      </button>

      <button id="btn-copy" class="px-3 py-1.5 text-xs bg-[#7a2420] hover:bg-[#962d28] text-white rounded border border-[#962d28] transition font-medium">
        Copia HTML
      </button>

      <button id="btn-download" class="px-4 py-1.5 text-xs bg-[#c94a3a] hover:bg-[#dc5443] text-white rounded font-semibold transition shadow-[0_0_12px_rgba(201,74,58,0.4)] flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Scarica index.html
      </button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden relative">
    
    <!-- PANNELLO EDITOR (LEFT SIDEBAR) -->
    <aside id="sidebar" class="w-96 max-w-[90vw] bg-[#0d0a09] border-r border-[#241c19] flex flex-col h-full z-20 transition-all duration-300 ease-in-out shrink-0">
      <div class="p-3 bg-[#14100e] border-b border-[#241c19] text-xs text-gray-400 flex justify-between items-center">
        <span>CONFIGURATORE TEMPLATE</span>
        <span class="text-[10px] text-[#c94a3a] bg-[#7a2420]/20 px-2 py-0.5 rounded border border-[#7a2420]/40">v2.4 GitHub Ready</span>
      </div>

      <!-- Form Controls Scrollable Area -->
      <div id="editor-controls" class="flex-1 overflow-y-auto p-4 space-y-3 text-sm select-text">
        
        <!-- SECTION 1: COLORI E STILI -->
        <div class="border border-[#241c19] rounded bg-[#070504] overflow-hidden">
          <button class="accordion-header w-full p-3 text-left font-oswald text-gray-200 flex justify-between items-center bg-[#14100e] hover:bg-[#1a1412] transition">
            <span>🎨 COLORI & TEMA</span>
            <svg class="w-4 h-4 transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div class="accordion-content p-3 space-y-3 border-t border-[#241c19]">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs text-gray-400 mb-1">Sfondo Scuro</label>
                <div class="flex items-center gap-2">
                  <input type="color" data-css="--nero" class="w-8 h-8 rounded bg-transparent cursor-pointer border-0">
                  <span class="text-xs font-mono text-gray-300" data-css-val="--nero">#070504</span>
                </div>
              </div>
              <div>
                <label class="block text-xs text-gray-400 mb-1">Sfondo Schede</label>
                <div class="flex items-center gap-2">
                  <input type="color" data-css="--nero-alt" class="w-8 h-8 rounded bg-transparent cursor-pointer border-0">
                  <span class="text-xs font-mono text-gray-300" data-css-val="--nero-alt">#0d0a09</span>
                </div>
              </div>
              <div>
                <label class="block text-xs text-gray-400 mb-1">Rosso Scuro (Btn)</label>
                <div class="flex items-center gap-2">
                  <input type="color" data-css="--rosso" class="w-8 h-8 rounded bg-transparent cursor-pointer border-0">
                  <span class="text-xs font-mono text-gray-300" data-css-val="--rosso">#7a2420</span>
                </div>
              </div>
              <div>
                <label class="block text-xs text-gray-400 mb-1">Rosso Vivo (Accenti)</label>
                <div class="flex items-center gap-2">
                  <input type="color" data-css="--rosso-vivo" class="w-8 h-8 rounded bg-transparent cursor-pointer border-0">
                  <span class="text-xs font-mono text-gray-300" data-css-val="--rosso-vivo">#c94a3a</span>
                </div>
              </div>
              <div>
                <label class="block text-xs text-gray-400 mb-1">Testo Principale</label>
                <div class="flex items-center gap-2">
                  <input type="color" data-css="--grigio" class="w-8 h-8 rounded bg-transparent cursor-pointer border-0">
                  <span class="text-xs font-mono text-gray-300" data-css-val="--grigio">#d6cfc6</span>
                </div>
              </div>
              <div>
                <label class="block text-xs text-gray-400 mb-1">Testo Secondario</label>
                <div class="flex items-center gap-2">
                  <input type="color" data-css="--grigio-soft" class="w-8 h-8 rounded bg-transparent cursor-pointer border-0">
                  <span class="text-xs font-mono text-gray-300" data-css-val="--grigio-soft">#8c8378</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- SECTION 2: HEADER & LOGO -->
        <div class="border border-[#241c19] rounded bg-[#070504] overflow-hidden">
          <button class="accordion-header w-full p-3 text-left font-oswald text-gray-200 flex justify-between items-center bg-[#14100e] hover:bg-[#1a1412] transition">
            <span>📌 HEADER & LOGO</span>
            <svg class="w-4 h-4 transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div class="accordion-content p-3 space-y-3 border-t border-[#241c19]">
            <div>
              <label class="block text-xs text-gray-400 mb-1">Nome Studio / Logo</label>
              <input type="text" data-bind="logo" class="w-full bg-[#14100e] border border-[#241c19] rounded p-2 text-xs text-white focus:border-[#c94a3a] outline-none">
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Voci Menu Navigazione</label>
              <div class="grid grid-cols-2 gap-2">
                <input type="text" data-bind="nav1" class="bg-[#14100e] border border-[#241c19] rounded p-1.5 text-xs text-white">
                <input type="text" data-bind="nav2" class="bg-[#14100e] border border-[#241c19] rounded p-1.5 text-xs text-white">
                <input type="text" data-bind="nav3" class="bg-[#14100e] border border-[#241c19] rounded p-1.5 text-xs text-white">
                <input type="text" data-bind="nav4" class="bg-[#14100e] border border-[#241c19] rounded p-1.5 text-xs text-white">
              </div>
            </div>
          </div>
        </div>

        <!-- SECTION 3: HERO -->
        <div class="border border-[#241c19] rounded bg-[#070504] overflow-hidden">
          <button class="accordion-header w-full p-3 text-left font-oswald text-gray-200 flex justify-between items-center bg-[#14100e] hover:bg-[#1a1412] transition">
            <span>🔥 SEZIONE HERO</span>
            <svg class="w-4 h-4 transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div class="accordion-content p-3 space-y-3 border-t border-[#241c19]">
            <div>
              <label class="block text-xs text-gray-400 mb-1">Etichetta Superiore (Label)</label>
              <input type="text" data-bind="heroLabel" class="w-full bg-[#14100e] border border-[#241c19] rounded p-2 text-xs text-white focus:border-[#c94a3a] outline-none">
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Titolo Principale (H1)</label>
              <textarea data-bind="heroTitle" rows="2" class="w-full bg-[#14100e] border border-[#241c19] rounded p-2 text-xs text-white focus:border-[#c94a3a] outline-none"></textarea>
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Descrizione</label>
              <textarea data-bind="heroDesc" rows="3" class="w-full bg-[#14100e] border border-[#241c19] rounded p-2 text-xs text-white focus:border-[#c94a3a] outline-none"></textarea>
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Testo Bottone CTA</label>
              <input type="text" data-bind="heroCta" class="w-full bg-[#14100e] border border-[#241c19] rounded p-2 text-xs text-white focus:border-[#c94a3a] outline-none">
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Testo Suggerimento Scroll</label>
              <input type="text" data-bind="heroScroll" class="w-full bg-[#14100e] border border-[#241c19] rounded p-2 text-xs text-white focus:border-[#c94a3a] outline-none">
            </div>
          </div>
        </div>

        <!-- SECTION 4: FOGLIO CONTATTI (GALLERIA) -->
        <div class="border border-[#241c19] rounded bg-[#070504] overflow-hidden">
          <button class="accordion-header w-full p-3 text-left font-oswald text-gray-200 flex justify-between items-center bg-[#14100e] hover:bg-[#1a1412] transition">
            <span>📷 FOGLIO CONTATTI (GALLERIA)</span>
            <svg class="w-4 h-4 transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div class="accordion-content p-3 space-y-4 border-t border-[#241c19]">
            <div>
              <label class="block text-xs text-gray-400 mb-1">Titolo Sezione</label>
              <input type="text" data-bind="foglioTitle" class="w-full bg-[#14100e] border border-[#241c19] rounded p-2 text-xs text-white">
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Descrizione Sezione</label>
              <textarea data-bind="foglioDesc" rows="2" class="w-full bg-[#14100e] border border-[#241c19] rounded p-2 text-xs text-white"></textarea>
            </div>
            
            <hr class="border-[#241c19]">
            <div class="flex justify-between items-center">
              <span class="text-xs font-semibold text-[#c94a3a]">FOTOGRAMMI (OPERE)</span>
              <button id="btn-add-frame" class="px-2 py-1 text-[11px] bg-[#7a2420] hover:bg-[#c94a3a] text-white rounded transition">+ Aggiungi</button>
            </div>

            <!-- List of Frames Container -->
            <div id="frames-list" class="space-y-3">
              <!-- Dynamically Populated -->
            </div>
          </div>
        </div>

        <!-- SECTION 5: PROCESSO DI SVILUPPO -->
        <div class="border border-[#241c19] rounded bg-[#070504] overflow-hidden">
          <button class="accordion-header w-full p-3 text-left font-oswald text-gray-200 flex justify-between items-center bg-[#14100e] hover:bg-[#1a1412] transition">
            <span>🧪 PROCESSO DI SVILUPPO</span>
            <svg class="w-4 h-4 transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div class="accordion-content p-3 space-y-3 border-t border-[#241c19]">
            <div>
              <label class="block text-xs text-gray-400 mb-1">Titolo Sezione</label>
              <input type="text" data-bind="processTitle" class="w-full bg-[#14100e] border border-[#241c19] rounded p-2 text-xs text-white">
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Sottotitolo</label>
              <input type="text" data-bind="processDesc" class="w-full bg-[#14100e] border border-[#241c19] rounded p-2 text-xs text-white">
            </div>
            <div id="vasche-list" class="space-y-3 pt-2">
              <!-- Dynamically Populated -->
            </div>
          </div>
        </div>

        <!-- SECTION 6: ARTISTA & STATISTICHE -->
        <div class="border border-[#241c19] rounded bg-[#070504] overflow-hidden">
          <button class="accordion-header w-full p-3 text-left font-oswald text-gray-200 flex justify-between items-center bg-[#14100e] hover:bg-[#1a1412] transition">
            <span>👤 ARTISTA & BIOGRAFIA</span>
            <svg class="w-4 h-4 transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div class="accordion-content p-3 space-y-3 border-t border-[#241c19]">
            <div>
              <label class="block text-xs text-gray-400 mb-1">Kicker / Sopratitolo</label>
              <input type="text" data-bind="artistKicker" class="w-full bg-[#14100e] border border-[#241c19] rounded p-2 text-xs text-white">
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Nome Artista</label>
              <input type="text" data-bind="artistName" class="w-full bg-[#14100e] border border-[#241c19] rounded p-2 text-xs text-white">
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Biografia Paragrafo 1</label>
              <textarea data-bind="artistBio1" rows="3" class="w-full bg-[#14100e] border border-[#241c19] rounded p-2 text-xs text-white"></textarea>
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Biografia Paragrafo 2</label>
              <textarea data-bind="artistBio2" rows="3" class="w-full bg-[#14100e] border border-[#241c19] rounded p-2 text-xs text-white"></textarea>
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Foto Artista (URL o Upload File)</label>
              <div class="space-y-2">
                <input type="text" id="artist-img-url" placeholder="https://..." class="w-full bg-[#14100e] border border-[#241c19] rounded p-1.5 text-xs text-white">
                <input type="file" id="artist-img-file" accept="image/*" class="w-full text-xs text-gray-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-[#1a1412] file:text-white hover:file:bg-[#28201d]">
              </div>
            </div>
            <hr class="border-[#241c19] my-2">
            <span class="text-xs font-semibold text-[#c94a3a]">STATISTICHE CHIAVE</span>
            <div class="grid grid-cols-3 gap-2">
              <div>
                <input type="text" data-bind="stat1Num" class="w-full bg-[#14100e] border border-[#241c19] rounded p-1 text-xs text-white font-mono" placeholder="312">
                <input type="text" data-bind="stat1Label" class="w-full bg-[#14100e] border border-[#241c19] rounded p-1 text-[10px] text-gray-400 mt-1" placeholder="Opere">
              </div>
              <div>
                <input type="text" data-bind="stat2Num" class="w-full bg-[#14100e] border border-[#241c19] rounded p-1 text-xs text-white font-mono" placeholder="12">
                <input type="text" data-bind="stat2Label" class="w-full bg-[#14100e] border border-[#241c19] rounded p-1 text-[10px] text-gray-400 mt-1" placeholder="Anni">
              </div>
              <div>
                <input type="text" data-bind="stat3Num" class="w-full bg-[#14100e] border border-[#241c19] rounded p-1 text-xs text-white font-mono" placeholder="6">
                <input type="text" data-bind="stat3Label" class="w-full bg-[#14100e] border border-[#241c19] rounded p-1 text-[10px] text-gray-400 mt-1" placeholder="Mesi">
              </div>
            </div>
          </div>
        </div>

        <!-- SECTION 7: PRENOTAZIONE & FOOTER -->
        <div class="border border-[#241c19] rounded bg-[#070504] overflow-hidden">
          <button class="accordion-header w-full p-3 text-left font-oswald text-gray-200 flex justify-between items-center bg-[#14100e] hover:bg-[#1a1412] transition">
            <span>✉️ PRENOTAZIONE & FOOTER</span>
            <svg class="w-4 h-4 transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div class="accordion-content p-3 space-y-3 border-t border-[#241c19]">
            <div>
              <label class="block text-xs text-gray-400 mb-1">Titolo Sezione Prenotazione</label>
              <input type="text" data-bind="ctaTitle" class="w-full bg-[#14100e] border border-[#241c19] rounded p-2 text-xs text-white">
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Descrizione Prenotazione</label>
              <textarea data-bind="ctaDesc" rows="2" class="w-full bg-[#14100e] border border-[#241c19] rounded p-2 text-xs text-white"></textarea>
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Email / Link Contatto</label>
              <input type="text" data-bind="ctaMail" class="w-full bg-[#14100e] border border-[#241c19] rounded p-2 text-xs text-white">
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Testo Bottone Scrivi</label>
              <input type="text" data-bind="ctaBtn" class="w-full bg-[#14100e] border border-[#241c19] rounded p-2 text-xs text-white">
            </div>
            <hr class="border-[#241c19]">
            <div>
              <label class="block text-xs text-gray-400 mb-1">Link Footer (Instagram, Citta, Copyright)</label>
              <div class="space-y-2">
                <input type="text" data-bind="footLink1" class="w-full bg-[#14100e] border border-[#241c19] rounded p-1.5 text-xs text-white" placeholder="Instagram">
                <input type="text" data-bind="footLink2" class="w-full bg-[#14100e] border border-[#241c19] rounded p-1.5 text-xs text-white" placeholder="Milano, Via Brera 14">
                <input type="text" data-bind="footLink3" class="w-full bg-[#14100e] border border-[#241c19] rounded p-1.5 text-xs text-white" placeholder="©️ 2026">
              </div>
            </div>
          </div>
        </div>

      </div>
    </aside>

    <!-- ANTEPRIMA LIVE IFRAME CONTAINER -->
    <main class="flex-1 bg-[#050302] flex items-center justify-center p-2 md:p-6 overflow-hidden relative">
      <div id="device-wrapper" class="device-desktop relative bg-black shadow-2xl transition-all duration-300">
        <iframe id="preview-iframe" class="w-full h-full border-0 bg-[#070504]"></iframe>
      </div>
    </main>

  </div>

  <script>
    // DATI PREDEFINITI DEL TEMPLATE
    const defaultData = {
      theme: {
        "--nero": "#070504",
        "--nero-alt": "#0d0a09",
        "--rosso": "#7a2420",
        "--rosso-vivo": "#c94a3a",
        "--grigio": "#d6cfc6",
        "--grigio-soft": "#8c8378"
      },
      content: {
        logo: "MARCHETTI",
        nav1: "Foglio Contatti",
        nav2: "Sviluppo",

    // Populate Dynamic Lists in Editor Panel
    function renderDynamicControls() {
      // Frames List
      const framesList = document.getElementById('frames-list');
      framesList.innerHTML = '';
      appState.frames.forEach((frame, idx) => {
        const div = document.createElement('div');
        div.className = "bg-[#14100e] border border-[#241c19] p-3 rounded space-y-2 relative group";
        div.innerHTML = `
          <div class="flex justify-between items-center">

          <input type="text" value="${frame.titolo}" onchange="updateFrame(${idx}, 'titolo', this.value)" class="w-full bg-[#070504] border border-[#241c19] rounded p-1 text-xs text-white" placeholder="Titolo">

    // Helper Dynamic Actions
    window.removeFrame = function(idx) {
      appState.frames.splice(idx, 1);
      saveAndRefresh();
    };

    window.updateFrame = function(idx, key, val) {
      appState.frames[idx][key] = val;
      saveAndRefresh();
    };

    window.uploadFrameImg = function(idx, input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          appState.frames[idx].img = e.target.result;
          saveAndRefresh();
        };
        reader.readAsDataURL(input.files[0]);
      }
    };

    window.updateVasca = function(idx, key, val) {
      appState.vasche[idx][key] = val;
      saveAndRefresh();
    };

    // Bind static form inputs
    function bindInputs() {
      // CSS Colors
      document.querySelectorAll('input[data-css]').forEach(input => {
        const cssVar = input.getAttribute('data-css');
        input.value = appState.theme[cssVar] || "#000000";
        input.addEventListener('input', (e) => {
          appState.theme[cssVar] = e.target.value;
          document.querySelector(`[data-css-val="${cssVar}"]`).textContent = e.target.value;
          saveAndRefresh();
        });
      });

      // Text Fields
      document.querySelectorAll('[data-bind]').forEach(input => {
        const key = input.getAttribute('data-bind');
        if (appState.content[key] !== undefined) {
          input.value = appState.content[key];
        }
        input.addEventListener('input', (e) => {
          appState.content[key] = e.target.value;
          saveAndRefresh();
        });
      });

      if (appState.content.artistImg && !appState.content.artistImg.startsWith('data:')) {
        document.getElementById('artist-img-url').value = appState.content.artistImg;
      }
    }

  *{margin:0; padding:0; box-sizing:border-box;}

    // Update Iframe Preview
    function updatePreview() {
      const iframe = document.getElementById('preview-iframe');
      const cleanHTML = generateCleanHTML(appState);
      
      // Preservare scroll posizione iframe durante modifiche
      const scrollY = iframe.contentWindow ? iframe.contentWindow.scrollY : 0;
      
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open();
      doc.write(cleanHTML);
      doc.close();

      setTimeout(() => {
        if (iframe.contentWindow) iframe.contentWindow.scrollTo(0, scrollY);
      }, 50);
    }

    // Save State and Refresh UI
    function saveAndRefresh() {
      localStorage.setItem('marchetti_template_state', JSON.stringify(appState));
      updatePreview();
    }

    // Viewport Toggle
    document.getElementById('view-desktop').addEventListener('click', () => {
      const wrapper = document.getElementById('device-wrapper');
      wrapper.className = "device-desktop relative bg-black shadow-2xl transition-all duration-300";
      document.getElementById('view-desktop').classList.add('bg-[#241c19]', 'text-white');
      document.getElementById('view-mobile').classList.remove('bg-[#241c19]', 'text-white');
    });

    document.getElementById('view-mobile').addEventListener('click', () => {
      const wrapper = document.getElementById('device-wrapper');
      wrapper.className = "device-mobile relative bg-black shadow-2xl transition-all duration-300";
      document.getElementById('view-mobile').classList.add('bg-[#241c19]', 'text-white');
      document.getElementById('view-desktop').classList.remove('bg-[#241c19]', 'text-white');
    });

    // Toggle Sidebar visibility
    document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('-ml-96');
    });

    // DOWNLOAD INDEX.HTML (Ready for GitHub)
    document.getElementById('btn-download').addEventListener('click', () => {
      const htmlCode = generateCleanHTML(appState);
      const blob = new Blob([htmlCode], { type: 'text/html;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'index.html';
      link.click();
      URL.revokeObjectURL(link.href);
    });

    // COPY HTML CODE TO CLIPBOARD
    document.getElementById('btn-copy').addEventListener('click', () => {
      const htmlCode = generateCleanHTML(appState);
      const dummy = document.createElement('textarea');
      document.body.appendChild(dummy);
      dummy.value = htmlCode;
      dummy.select();
      document.execCommand('copy');
      document.body.removeChild(dummy);
      
      const btn = document.getElementById('btn-copy');
      const originalText = btn.innerText;
      btn.innerText = "Copiato!";
      btn.classList.add('bg-green-700');
      setTimeout(() => {
        btn.innerText = originalText;
        btn.classList.remove('bg-green-700');
      }, 2000);
    });

    // RESET DEFAULT
    document.getElementById('btn-reset').addEventListener('click', () => {
      if (confirm('Sei sicuro di voler ripristinare il template iniziale? Tutte le modifiche andranno perse.')) {
        appState = JSON.parse(JSON.stringify(defaultData));
        localStorage.removeItem('marchetti_template_state');
        initApp();
      }
    });

    // EXPORT / IMPORT JSON CONFIG
    document.getElementById('btn-export-json').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'marchetti-config.json';
      link.click();
    });

    document.getElementById('btn-import-json').addEventListener('click', () => {
      document.getElementById('input-import-json').click();
    });

    document.getElementById('input-import-json').addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          try {
            appState = JSON.parse(evt.target.result);
            initApp();
          } catch(err) {
            alert('File JSON non valido!');
          }
        };
        reader.readAsText(e.target.files[0]);
      }
    });

    // Initialize App
    function initApp() {
      bindInputs();
      renderDynamicControls();
      updatePreview();
    }

    window.onload = function() {
      initApp();
      // Apri il primo accordion per default
      const firstAccordion = document.querySelector('.accordion-content');
      if (firstAccordion) firstAccordion.classList.add('open');
    };
  </script>
</body>
